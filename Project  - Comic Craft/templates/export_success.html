<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Complete
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


<main class="container">


    <section class="card success">


        <div class="success-icon">
            ✓
        </div>


        <h1>
            Comic Export Complete
        </h1>


        <p>
            Your ComicCraft PDF is ready.
        </p>


        {% if pdf_path %}

        <a
            class="button primary"
            href="{{ pdf_path }}"
            download
        >
            Download PDF
        </a>

        {% endif %}


        <a
            class="button secondary"
            href="/"
        >
            Go Create Another Comic
        </a>


    </section>


</main>


</body>

</html>
